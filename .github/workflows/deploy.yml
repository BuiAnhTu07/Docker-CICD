
name: Docker CI CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Build and deploy Docker
        run: |
          docker compose down
          docker compose up -d --build

      - name: Check container
        run: |
          docker compose ps
          curl -f http://localhost:8080/
